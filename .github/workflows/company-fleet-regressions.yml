name: Company fleet flow regressions

on:
  push:
    branches:
      - security/guard-driver-profile-and-assignment-history
  pull_request:
    branches:
      - feature/company-fleet-foundation
    paths:
      - ".github/workflows/company-fleet-regressions.yml"
      - "app.js"
      - "supabase/functions/admin-create-driver/**"
      - "supabase/functions/bolt-sync/**"
      - "supabase/functions/uber-report-import/**"
      - "supabase/migrations/20261026190000_company_fleet_foundation.sql"
      - "supabase/migrations/20261026200000_company_memberships_and_integrity.sql"
      - "supabase/migrations/20261030230000_company_fleet_rls.sql"
      - "supabase/migrations/20261103000100_fleet_assignment_history_security.sql"
      - "supabase/tests/assignment_history_guard_preflight.sql"
      - "supabase/tests/atomic_vehicle_assignments_preflight.sql"
      - "supabase/tests/company_fleet_flow_ci_fixture.sql"
      - "supabase/tests/company_fleet_flow_behavior.sql"
      - "supabase/tests/company_fleet_flow_concurrency.sh"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend_and_integrations:
    name: Frontend syntax and provider function type checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check application JavaScript syntax
        run: node --check app.js
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check fleet creation and provider integrations without credentials
        run: deno check supabase/functions/admin-create-driver/index.ts supabase/functions/bolt-sync/index.ts supabase/functions/uber-report-import/index.ts

  postgres:
    name: PostgreSQL company, vehicle and driver regressions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fleet_test
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Create disposable test database
        run: psql postgresql://postgres:postgres@localhost:5432/postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE fleet_test"
      - name: Apply isolated fixture and fleet migrations
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/company_fleet_flow_ci_fixture.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261026190000_company_fleet_foundation.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261026200000_company_memberships_and_integrity.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261030230000_company_fleet_rls.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261103000100_fleet_assignment_history_security.sql
      - name: Run company isolation, fleet flow and history regressions
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/assignment_history_guard_preflight.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/atomic_vehicle_assignments_preflight.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/company_fleet_flow_behavior.sql
          bash supabase/tests/company_fleet_flow_concurrency.sh
